name: SHDeathSpectating
version: '${project.version}'
main: org.Cry_Legende.sHDeathSpectating.SHDeathSpectating
api-version: '1.20'
author: Cry_Legende
depend: [ProtocolLib]
# SHNetwork et HuskSync sont facultatifs : sans SHNetwork, l'état de mort reste dans spectating.yml comme avant.
softdepend: [packetevents, SHNetwork, HuskSync]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (état de mort en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shdeathspectating:
    description: Administration de SHDeathSpectating
    usage: /<command> <import|reload|respawn>

permissions:
  shdeathspectating.admin:
    description: Toutes les sous-commandes de /shdeathspectating
    default: op
    children:
      shdeathspectating.admin.import: true
      shdeathspectating.admin.reload: true
      shdeathspectating.admin.respawn: true
  shdeathspectating.admin.import:
    description: Copier les morts de spectating.yml dans la base partagée (/shdeathspectating import)
    default: op
  shdeathspectating.admin.reload:
    description: Recharger la configuration (/shdeathspectating reload)
    default: op
  shdeathspectating.admin.respawn:
    description: Faire réapparaître un joueur resté en état de mort (/shdeathspectating respawn)
    default: op
