name: SHDeathSpectating
version: '${project.version}'
main: org.Cry_Legende.sHDeathSpectating.SHDeathSpectating
api-version: '1.20'
author: Cry_Legende
depend: [ProtocolLib]
# SHNetwork et HuskSync sont facultatifs : sans SHNetwork, l'état de mort reste dans spectating.yml comme avant.
softdepend: [packetevents, SHNetwork, HuskSync]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (état de mort en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shdeathspectating:
    description: Administration de SHDeathSpectating
    usage: /shdeathspectating import
    permission: shdeathspectating.admin

permissions:
  shdeathspectating.admin:
    description: Utiliser /shdeathspectating
    default: op
